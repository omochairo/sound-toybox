<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホでのズーム防止、スクロール抑止用のviewport設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>おととかたちのピタゴラパズル | sound-toybox</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: 幼児向けに丸みのあるフォント（M PLUS Rounded 1c）を採用 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
  <!-- Matter.js 2D物理エンジンライブラリ (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <!-- スタート画面 (iOS/Android の Web Audio 規制解除用) -->
  <div id="start-screen" class="overlay">
    <div class="start-card">
      <h1>おととかたちの<br>ピタゴラパズル</h1>
      <p class="subtitle">おもちゃを おいて ボールを はねかえそう！</p>
      <button id="btn-start" class="pulse-animation">おとをだして あそぶ ▶</button>
    </div>
  </div>

  <!-- パズルクリア画面モーダル (6〜8歳向け) -->
  <div id="clear-modal" class="overlay hidden">
    <div class="clear-card">
      <h2 class="bounce-animation">🌟 クリア！ 🌟</h2>
      <p class="clear-message">じょうずに ボールを はこべたね！</p>
      <button id="btn-next-stage">つぎの ステージへ ▶</button>
    </div>
  </div>

  <!-- 音階選択ミニピアノ鍵盤ポップアップUI -->
  <div id="piano-keyboard" class="hidden">
    <div class="keys-container">
      <!-- 白鍵 (8鍵) -->
      <button class="piano-key white" data-note="0"><span>ド</span></button>
      <button class="piano-key white" data-note="2"><span>レ</span></button>
      <button class="piano-key white" data-note="4"><span>ミ</span></button>
      <button class="piano-key white" data-note="5"><span>ファ</span></button>
      <button class="piano-key white" data-note="7"><span>ソ</span></button>
      <button class="piano-key white" data-note="9"><span>ラ</span></button>
      <button class="piano-key white" data-note="11"><span>シ</span></button>
      <button class="piano-key white" data-note="12"><span>ど</span></button>
      
      <!-- 黒鍵 (5鍵) - 白鍵の隙間に絶対配置 -->
      <button class="piano-key black" data-note="1" style="left: 28px;"><span>ド#</span></button>
      <button class="piano-key black" data-note="3" style="left: 68px;"><span>レ#</span></button>
      <button class="piano-key black" data-note="6" style="left: 148px;"><span>ファ#</span></button>
      <button class="piano-key black" data-note="8" style="left: 188px;"><span>ソ#</span></button>
      <button class="piano-key black" data-note="10" style="left: 228px;"><span>ラ#</span></button>
    </div>
    <div class="piano-arrow"></div>
  </div>

  <!-- メインゲーム画面 -->
  <div id="game-container">
    <!-- 年齢選択ナビゲーションバー（画面上部に固定） -->
    <div id="age-selector" class="hidden-ui">
      <button class="age-tab active" data-mode="3-5">3〜5さい<br><small>おもちゃばこ</small></button>
      <button class="age-tab" data-mode="6-8">6〜8さい<br><small>ルートパズル</small></button>
      <button class="age-tab" data-mode="9-10">9〜10さい<br><small>ピタゴラおんがく</small></button>
    </div>

    <!-- 6〜8歳モード用ステージセレクター（画面上部中央） -->
    <div id="stage-selector" class="mode-ui hidden">
      <button class="stage-btn active" data-stage="1">ステージ 1</button>
      <button class="stage-btn" data-stage="2">ステージ 2</button>
      <button class="stage-btn" data-stage="3">ステージ 3</button>
    </div>

    <!-- 9〜10歳モード用物理・音楽調整パネル（画面上部右側） -->
    <div id="physics-panel" class="mode-ui hidden">
      <div class="slider-row">
        <div class="slider-group">
          <label for="slider-gravity">じゅうりょく: <span id="val-gravity">0.6</span></label>
          <input type="range" id="slider-gravity" min="0.0" max="1.5" step="0.1" value="0.6">
        </div>
        <div class="slider-group">
          <label for="slider-friction">まさつ: <span id="val-friction">0.1</span></label>
          <input type="range" id="slider-friction" min="0.0" max="0.5" step="0.05" value="0.1">
        </div>
        <div class="slider-group">
          <label for="slider-bpm">テンポ (BPM): <span id="val-bpm">120</span></label>
          <input type="range" id="slider-bpm" min="40" max="200" step="10" value="120">
        </div>
      </div>
      <div class="toggle-row" style="display: flex; gap: 8px; width: 100%;">
        <button id="btn-toggle-guide" class="toggle-btn active" style="flex: 1;">ガイド: ON</button>
        <button id="btn-toggle-debug-910" class="toggle-btn" style="flex: 1;">デバッグ: OFF</button>
      </div>
    </div>

    <!-- 物理エンジン描画用のCanvasがここに生成されます -->

    <!-- 下部コントロールパネル -->
    <div id="control-panel">
      <!-- 3〜5歳用ツール群 -->
      <div id="tools-3-5" class="tool-group mode-ui">
        <button class="tool-btn active" data-shape="circle">
          <div class="shape-preview circle"></div>
          <span>まる</span>
        </button>
        <button class="tool-btn" data-shape="triangle">
          <div class="shape-preview triangle"></div>
          <span>さんかく</span>
        </button>
        <button class="tool-btn" data-shape="square">
          <div class="shape-preview square"></div>
          <span>しかく</span>
        </button>
      </div>

      <!-- 6〜8歳用ツール群 -->
      <div id="tools-6-8" class="tool-group mode-ui hidden">
        <button class="tool-btn active" data-shape="slope">
          <div class="shape-preview slope"></div>
          <span>さかみち</span>
        </button>
        <button class="tool-btn" data-shape="bouncer">
          <div class="shape-preview bouncer"></div>
          <span>ジャンプ</span>
        </button>
        <button class="tool-btn" data-shape="conveyor">
          <div class="shape-preview conveyor"></div>
          <span>ベルト</span>
        </button>
      </div>

      <!-- 9〜10歳用全アイテム解放・サブカテゴリ切り替えパネル -->
      <div id="tools-9-10" class="tool-group mode-ui hidden">
        <!-- カテゴリ切り替えタブ -->
        <div class="sub-tabs">
          <button class="sub-tab active" data-sub="shape">🧱かたち</button>
          <button class="sub-tab" data-sub="gimmick">⚙️ぎみっく</button>
          <button class="sub-tab" data-sub="music">🎵おんがく</button>
        </div>
        <!-- カテゴリ1: かたち -->
        <div id="sub-shape" class="sub-tool-panel">
          <button class="tool-btn active" data-shape="circle"><div class="shape-preview circle"></div><span>まる</span></button>
          <button class="tool-btn" data-shape="triangle"><div class="shape-preview triangle"></div><span>さんかく</span></button>
          <button class="tool-btn" data-shape="square"><div class="shape-preview square"></div><span>しかく</span></button>
          <button class="tool-btn" data-shape="slope"><div class="shape-preview slope"></div><span>さかみち</span></button>
        </div>
        <!-- カテゴリ2: ぎみっく -->
        <div id="sub-gimmick" class="sub-tool-panel hidden">
          <button class="tool-btn" data-shape="bouncer"><div class="shape-preview bouncer"></div><span>ジャンプ</span></button>
          <button class="tool-btn" data-shape="conveyor"><div class="shape-preview conveyor"></div><span>ベルト</span></button>
          <button class="tool-btn" data-shape="gear"><div class="shape-preview gear-icon">⚙️</div><span>はぐるま</span></button>
          <button class="tool-btn" data-shape="motor-gear"><div class="shape-preview motor-gear-icon">🌀</div><span>モーター</span></button>
        </div>
        <!-- カテゴリ3: おんがく -->
        <div id="sub-music" class="sub-tool-panel hidden">
          <button class="tool-btn" data-shape="note"><div class="shape-preview note-icon">🎵</div><span>おんぷ</span></button>
          <button class="tool-btn" data-shape="drum"><div class="shape-preview drum-icon">🥁</div><span>ドラム</span></button>
        </div>
      </div>

      <!-- 共通アクション群 -->
      <div class="action-group">
        <button id="btn-ball-drop" class="action-btn">
          <div class="ball-icon">●</div>
          <span>ボール</span>
        </button>
        <button id="btn-clear" class="action-btn danger">
          <div class="trash-icon">🗑️</div>
          <span>けす</span>
        </button>
      </div>
    </div>

    <!-- 全モード共通デバッグトグルボタン（フローティング） -->
    <button id="btn-debug-float" title="デバッグ情報を表示">🛠️</button>

    <!-- リアルタイムデバッグパネル -->
    <div id="debug-panel" class="hidden">
      <div class="debug-header">
        <span>🛠️ デバッグ情報</span>
        <button id="btn-close-debug">×</button>
      </div>
      <div class="debug-body">
        <div class="debug-row">
          <span>モード:</span>
          <span id="debug-mode">-</span>
        </div>
        <div class="debug-row">
          <span>配列ボール数 (JS):</span>
          <span id="debug-arr-balls">0</span>
        </div>
        <div class="debug-row">
          <span>世界ボール数 (Matter):</span>
          <span id="debug-world-balls">0</span>
        </div>
        <div class="debug-row">
          <span>スリープボール数:</span>
          <span id="debug-sleep-balls">0</span>
        </div>
        <div class="debug-row">
          <span>描画FPS:</span>
          <span id="debug-fps">60</span>
        </div>
        <div class="debug-log-title">システムログ:</div>
        <div id="debug-log-list"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
